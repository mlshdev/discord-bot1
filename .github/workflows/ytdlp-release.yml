name: yt-dlp release watch

# GitHub cannot subscribe to another repository's release events, so upstream is polled.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytdlp-release-watch
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Deploy key: bypasses the `main` ruleset, and unlike GITHUB_TOKEN its push triggers docker.yml.
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.YTDLP_BUMP_DEPLOY_KEY }}

      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pattern='^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          latest="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq '.tag_name')"
          current="$(sed -n 's/^ARG YT_DLP_VERSION=//p' Dockerfile | head -n 1)"
          if [[ ! "${latest}" =~ ${pattern} ]]; then
            echo "::error::Unexpected upstream tag '${latest}'"
            exit 1
          fi
          if [[ ! "${current}" =~ ${pattern} ]]; then
            echo "::error file=Dockerfile::Unexpected YT_DLP_VERSION '${current}'"
            exit 1
          fi
          ready=false
          if [[ "${latest}" != "${current}" ]]; then
            assets="$(gh api "repos/yt-dlp/yt-dlp/releases/tags/${latest}" --jq '.assets[].name')"
            missing=0
            for asset in SHA2-256SUMS yt-dlp_linux.zip yt-dlp_linux_aarch64.zip; do
              grep -qx "${asset}" <<<"${assets}" || missing=1
            done
            if [[ "${missing}" -eq 0 ]]; then
              ready=true
            else
              echo "::notice::yt-dlp ${latest} is released but its assets are still uploading; retrying next run"
            fi
          fi
          echo "Current ${current}, upstream ${latest}, bump ${ready}"
          {
            echo "latest=${latest}"
            echo "current=${current}"
            echo "ready=${ready}"
          } >> "${GITHUB_OUTPUT}"

      - name: Bump pinned version
        if: steps.versions.outputs.ready == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          set -euo pipefail
          sed -i -E "s/^ARG YT_DLP_VERSION=.*/ARG YT_DLP_VERSION=${LATEST}/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "deps(yt-dlp): bump from ${CURRENT} to ${LATEST}"
          git push origin HEAD:main
