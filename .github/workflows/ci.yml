name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"

      - run: bun install --frozen-lockfile

      - run: bunx biome ci .

      - run: bunx tsc -p .

      - run: bun run test
